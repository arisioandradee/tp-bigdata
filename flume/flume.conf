agent.sources = r1
agent.channels = c1 c2
agent.sinks = k1 k2

# Source: tail do log gerado pelo Python. O seletor padrao (replicating)
# copia cada evento para TODOS os channels; um channel por sink garante fan-out
# (sinks no mesmo channel competiriam pelos eventos).
agent.sources.r1.type = exec
agent.sources.r1.command = tail -F /logs/ecommerce_events.log
agent.sources.r1.restart = true
agent.sources.r1.channels = c1 c2

agent.channels.c1.type = memory
agent.channels.c1.capacity = 10000
agent.channels.c1.transactionCapacity = 1000

agent.channels.c2.type = memory
agent.channels.c2.capacity = 10000
agent.channels.c2.transactionCapacity = 1000

# Sink 1: HDFS (logs brutos, consumidos pelo Spark)
agent.sinks.k1.type = hdfs
agent.sinks.k1.channel = c1
agent.sinks.k1.hdfs.path = hdfs://namenode:9000/raw/events/%Y-%m-%d/
agent.sinks.k1.hdfs.filePrefix = events-
agent.sinks.k1.hdfs.fileSuffix = .log
agent.sinks.k1.hdfs.fileType = DataStream
agent.sinks.k1.hdfs.writeFormat = Text
agent.sinks.k1.hdfs.rollInterval = 60
agent.sinks.k1.hdfs.rollSize = 0
agent.sinks.k1.hdfs.rollCount = 0
agent.sinks.k1.hdfs.minBlockReplicas = 1
agent.sinks.k1.hdfs.useLocalTimeStamp = true

# Sink 2: diretorio de streaming para o Flink. Arquivos em escrita ficam com
# prefixo "_" (ignorados pelo FileSource do Flink) e so viram visiveis,
# imutaveis, quando o roll fecha o arquivo.
agent.sinks.k2.type = hdfs
agent.sinks.k2.channel = c2
agent.sinks.k2.hdfs.path = file:///logs/flink_stream
agent.sinks.k2.hdfs.filePrefix = chunk
agent.sinks.k2.hdfs.fileSuffix = .jsonl
agent.sinks.k2.hdfs.inUsePrefix = _
agent.sinks.k2.hdfs.inUseSuffix = .tmp
agent.sinks.k2.hdfs.fileType = DataStream
agent.sinks.k2.hdfs.writeFormat = Text
agent.sinks.k2.hdfs.useRawLocalFileSystem = true
agent.sinks.k2.hdfs.rollInterval = 5
agent.sinks.k2.hdfs.rollSize = 0
agent.sinks.k2.hdfs.rollCount = 0
