global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: prometheus
    static_configs: [{targets: ["localhost:9090"]}]

  # API: latencia por rota (histograma), requisicoes, hit/miss do cache de busca
  - job_name: api
    metrics_path: /metrics
    static_configs: [{targets: ["api:8000"]}]

  # Consumidor Kafka -> Elasticsearch: docs/s, DLQ, latencia do bulk e LAG do consumidor
  - job_name: consumidor
    static_configs: [{targets: ["consumer:9100"]}]

  # Elasticsearch (saude do cluster, docs por indice, JVM)
  - job_name: elasticsearch
    static_configs: [{targets: ["elasticsearch-exporter:9114"]}]

  # Redis (memoria, clientes, keyspace hits/misses)
  - job_name: redis
    static_configs: [{targets: ["redis-exporter:9121"]}]
